name: Build Binary

on:
  workflow_call:
    inputs:
      config:
        description: The plugin's binary config, relative to its repository root.
        type: string
        default: binary.config.json
      node-version:
        type: string
        default: 26.8.2
      bun-version:
        type: string
        default: 1.4.2
      signing-environment:
        description: The deployment environment holding the Apple credentials.
        type: string
        default: macos-signing
      release-notes:
        description: A line to add to the notes of a release this workflow creates.
        type: string
        default: ""
    secrets:
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      CSC_LINK:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  plan:
    name: Read the Plugin's Binary Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      executable: ${{ steps.config.outputs.executable }}
      host-binary: ${{ steps.config.outputs.host-binary }}
      cross-binary: ${{ steps.config.outputs.cross-binary }}
      output-directory: ${{ steps.config.outputs.output-directory }}
      publishing: ${{ steps.gate.outputs.publishing }}
    steps:
      - name: Check Out the Plugin Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide Whether This Run Is Releasing
        id: gate
        env:
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo "publishing=$PUBLISHING" >> "$GITHUB_OUTPUT"

      - name: Read the Binary Config
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          node <<'READ_CONFIG'
          const { appendFileSync, readFileSync } = require("fs");
          const { dirname, join } = require("path");
          const config = JSON.parse(readFileSync(process.env.CONFIG, "utf8"));
          const targets = config.publishedTargets ?? { darwin: ["arm64", "x64"] };
          if (JSON.stringify(targets) !== JSON.stringify({ darwin: ["arm64", "x64"] })) {
            console.error(`This workflow builds macOS arm64 and x64 only. ${process.env.CONFIG} asks for ${JSON.stringify(targets)}.`);
            process.exit(1);
          }
          const executable = config.executableName;
          const directory = join(dirname(process.env.CONFIG), config.build.outputDirectory);
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `executable=${executable}`,
            `output-directory=${directory}`,
            `host-binary=${directory}/${executable}`,
            `cross-binary=${directory}/darwin-x64/${executable}`,
            "",
          ].join("\n"));
          READ_CONFIG

      - name: Check the Version Matches the Tag
        if: steps.gate.outputs.publishing == 'true'
        env:
          CONFIG: ${{ inputs.config }}
          TAG: ${{ github.ref_name }}
        run: |
          node <<'CHECK_VERSION'
          const { readFileSync } = require("fs");
          const { dirname, join } = require("path");
          const config = JSON.parse(readFileSync(process.env.CONFIG, "utf8"));
          const file = join(dirname(process.env.CONFIG), config.build.versionFile);
          const { version } = JSON.parse(readFileSync(file, "utf8"));
          if (version !== process.env.TAG) {
            console.error(`${file} is ${version} but the tag is ${process.env.TAG}. Bump the version, then retag.`);
            process.exit(1);
          }
          CHECK_VERSION

  build:
    name: Build the Unsigned Binaries
    needs: plan
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check Out the Plugin Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          architecture: arm64
          cache: pnpm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Unsigned Binaries
        env:
          CONFIG: ${{ inputs.config }}
        run: pnpm build:binary -- --config "$CONFIG" --arch=all
      - name: Test the Binary
        run: pnpm test:binary
      - name: Upload the Unsigned arm64 Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.executable }}-darwin-arm64-unsigned
          path: ${{ needs.plan.outputs.host-binary }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Unsigned x64 Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.executable }}-darwin-x64-unsigned
          path: ${{ needs.plan.outputs.cross-binary }}
          if-no-files-found: error
          retention-days: 7

  run-on-intel:
    name: Run the x64 Binary on Intel
    needs: [plan, build]
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Check Out the Plugin Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          architecture: x64
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Unsigned x64 Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.executable }}-darwin-x64-unsigned
          path: ${{ needs.plan.outputs.output-directory }}
      - name: Restore the Executable Bit and Report What Was Built
        env:
          BINARY: ${{ needs.plan.outputs.host-binary }}
        run: |
          chmod +x "$BINARY"
          arch
          file "$BINARY"
      - name: Test the Binary
        run: pnpm test:binary

  sign:
    name: Sign and Notarize the ${{ matrix.arch }} Binary
    needs: [plan, build]
    if: needs.plan.outputs.publishing == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: ${{ inputs.signing-environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    steps:
      - name: Check Out the Plugin Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Unsigned Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.executable }}-darwin-${{ matrix.arch }}-unsigned
          path: ${{ needs.plan.outputs.output-directory }}
      - name: Restore the Executable Bit
        env:
          BINARY: ${{ needs.plan.outputs.host-binary }}
        run: chmod +x "$BINARY"
      - name: Sign and Notarize the Binary
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CONFIG: ${{ inputs.config }}
        run: pnpm sign:binary -- --config "$CONFIG"
      - name: Test the Signed Binary
        run: pnpm test:binary
      - name: Upload the Signed Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.executable }}-darwin-${{ matrix.arch }}-signed
          path: ${{ needs.plan.outputs.host-binary }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the Binaries to the Release
    needs: [plan, build, run-on-intel, sign]
    if: needs.plan.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download the Signed Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.plan.outputs.executable }}-darwin-*-signed
          path: signed
      - name: Attach the Binaries to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          EXECUTABLE: ${{ needs.plan.outputs.executable }}
          EXTRA_NOTES: ${{ inputs.release-notes }}
        run: |
          set -euo pipefail
          mkdir -p release
          ASSETS=()
          for ARCH in arm64 x64; do
            NAME="$EXECUTABLE-darwin-$ARCH-$TAG"
            SIGNED="signed/$EXECUTABLE-darwin-$ARCH-signed/$EXECUTABLE"
            if [ ! -f "$SIGNED" ]; then
              echo "The $ARCH signing job uploaded no binary. Nothing is published." >&2
              exit 1
            fi
            mv "$SIGNED" "release/$NAME"
            (cd release && sha256sum "$NAME" > "$NAME.sha256")
            ASSETS+=("release/$NAME" "release/$NAME.sha256")
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            exit 0
          fi

          case "$TAG" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          cat > release/notes.md <<'NOTES'
          These macOS arm64 and x64 binaries are signed and notarized. Download the one matching
          your Mac, then run `chmod +x <binary>` and `./<binary> --install`. Check it against its
          SHA-256 sidecar first if you want to.
          NOTES
          if [ -n "$EXTRA_NOTES" ]; then printf '\n%s\n' "$EXTRA_NOTES" >> release/notes.md; fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --draft \
            --verify-tag \
            --prerelease="$PRERELEASE" \
            --generate-notes \
            --notes-file release/notes.md
