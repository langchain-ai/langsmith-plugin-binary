name: CI

on:
  workflow_dispatch:
    inputs:
      windows_only:
        type: boolean
        default: false
      stress_iterations:
        type: number
        default: 10
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/../plugins-base-ci-home
  USERPROFILE: ${{ github.workspace }}/../plugins-base-ci-home
  TMPDIR: ${{ github.workspace }}/../plugins-base-ci-home/tmp
  TEMP: ${{ github.workspace }}/../plugins-base-ci-home/tmp
  TMP: ${{ github.workspace }}/../plugins-base-ci-home/tmp
  LANGCHAIN_API_KEY: ""
  LANGSMITH_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  check:
    if: ${{ !inputs.windows_only }}
    name: Lint, Typecheck and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create an Isolated Home
        uses: ./.github/actions/isolated-home
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the Formatting
        run: pnpm lint:format
      - name: Lint
        run: pnpm lint:oxlint
      - name: Typecheck
        run: pnpm lint:types
      - name: Test
        run: pnpm test

  headless-plugin-checks:
    if: ${{ !inputs.windows_only }}
    name: Headless ${{ matrix.agent }} With This Engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            repository: langchain-ai/langsmith-claude-code-plugins
            plugin: plugins/langsmith-tracing
          - agent: codex
            repository: langchain-ai/langsmith-codex-plugins
            plugin: plugins/tracing
    env:
      CLAUDE_CODE_VERSION: 2.1.300
      CODEX_VERSION: 0.162.1
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Out the Plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: plugin-under-test
      - name: Create an Isolated Home
        uses: ./.github/actions/isolated-home
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Plugin Against This Engine
        working-directory: plugin-under-test
        run: |
          pnpm install --frozen-lockfile
          rm node_modules/@langchain/plugins-base
          ln -s "$GITHUB_WORKSPACE" node_modules/@langchain/plugins-base
          pnpm build
      - name: Install the Agents
        run: |
          npm install --prefix "$RUNNER_TEMP/agents" --no-save --package-lock=false "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION"
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run the Scenarios
        run: |
          for scenario in qa/scenarios/*.json; do
            node qa/headless.ts --agent ${{ matrix.agent }} --plugin "plugin-under-test/${{ matrix.plugin }}" --scenario "$scenario"
          done

  test-on-macos:
    if: ${{ !inputs.windows_only }}
    name: Test on macOS
    runs-on: macos-26
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create an Isolated Home
        uses: ./.github/actions/isolated-home
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  test-runtime-on-windows:
    name: Test Runtime on Windows
    runs-on: windows-latest
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create an Isolated Home
        uses: ./.github/actions/isolated-home
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Shared Runtime
        run: pnpm exec vitest run src/settings src/git src/storage src/metadata src/privacy src/tracing src/auth
      - name: Stress Windows Lock Contention
        shell: pwsh
        env:
          STRESS_ITERATIONS: ${{ inputs.stress_iterations || 10 }}
        run: |
          for ($iteration = 0; $iteration -lt [int]$env:STRESS_ITERATIONS; $iteration++) {
            pnpm exec vitest run src/storage/file-lock.test.ts --reporter=dot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  test-sdk-wire-matrix:
    if: ${{ !inputs.windows_only }}
    name: Wire Tests (${{ matrix.os }}, LangSmith ${{ matrix.langsmith-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
        langsmith-version: [latest]
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create an Isolated Home
        uses: ./.github/actions/isolated-home
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Primary Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install SDK Under Test
        shell: bash
        env:
          LANGSMITH_VERSION: ${{ matrix.langsmith-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-under-test"
          npm install --prefix "$RUNNER_TEMP/sdk-under-test" --ignore-scripts --no-save --package-lock=false "langsmith@$LANGSMITH_VERSION"
          node .github/scripts/link-sdk-under-test.mjs
      - name: Test SDK Wire Behavior
        run: pnpm exec vitest run src/privacy/run-tree.test.ts src/tracing/upload/upload.test.ts src/tracing/upload/replicas.test.ts --reporter=dot
