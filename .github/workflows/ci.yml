name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the Formatting
        run: pnpm lint:format
      - name: Lint
        run: pnpm lint:oxlint
      - name: Typecheck
        run: pnpm lint:types
      - name: Check the Compiled Output Is Current
        run: pnpm lint:dist
      - name: Test
        run: pnpm test

  test-on-macos:
    name: Test on macOS
    runs-on: macos-26
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  test-runtime-on-windows:
    name: Test Runtime on Windows
    runs-on: windows-latest
    env:
      HOME: ${{ github.workspace }}/.test-home
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Create an Isolated Home
        run: New-Item -ItemType Directory -Force -Path $env:HOME
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Shared Runtime
        run: pnpm exec vitest run src/settings src/git src/storage src/metadata src/privacy src/tracing
