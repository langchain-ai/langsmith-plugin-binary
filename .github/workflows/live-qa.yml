name: Live QA

on:
  workflow_dispatch:
    inputs:
      claude_code_version:
        type: string
        default: latest
      codex_version:
        type: string
        default: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/../plugins-base-ci-home
  TMPDIR: ${{ github.workspace }}/../plugins-base-ci-home/tmp
  LANGCHAIN_API_KEY: ""
  LANGSMITH_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  live-plugin-checks:
    name: Live ${{ matrix.agent }} With This Engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - agent: claude
            repository: langchain-ai/langsmith-claude-code-plugins
            plugin: plugins/langsmith-tracing
          - agent: codex
            repository: langchain-ai/langsmith-codex-plugins
            plugin: plugins/tracing
    env:
      CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version || 'latest' }}
      CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Out the Plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: plugin-under-test
      - name: Create an Isolated Home
        uses: ./.github/actions/isolated-home
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Plugin Against This Engine
        working-directory: plugin-under-test
        run: |
          pnpm install --frozen-lockfile
          rm node_modules/@langchain/plugins-base
          ln -s "$GITHUB_WORKSPACE" node_modules/@langchain/plugins-base
          pnpm build
      - name: Install the Agents
        run: |
          npm install --prefix "$RUNNER_TEMP/agents" --no-save --package-lock=false "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION"
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run the Scenarios Against LangSmith Dev
        env:
          QA_GATEWAY_API_KEY: ${{ secrets.QA_GATEWAY_API_KEY }}
          QA_TRACING_API_KEY: ${{ secrets.QA_TRACING_API_KEY }}
        run: |
          failed=0
          for scenario in qa/scenarios/*.json; do
            node qa/run.ts --agent ${{ matrix.agent }} --plugin "plugin-under-test/${{ matrix.plugin }}" --scenario "$scenario" --project plugin-qa-live || failed=1
          done
          exit $failed
